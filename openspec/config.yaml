schema: spec-driven

context: |
  FastAPI AI-platform template (Python 3.12, uv, pydantic v2, SQLAlchemy async, Alembic, Redis, Mongo optional).
  Architecture source of truth: docs/agents/architecture.md and docs/agents/ai-engineering.md.
  Rules: business modules never touch infra; app/bootstrap is the single owner of resource lifecycle and
  service composition; the API layer reaches services only via request.app.state.resources.
  One <Domain>Service class per business domain, one instance per app, built in lifespan.
  __init__.py files stay empty (docstring allowed), no __all__; import symbols from the defining file.
  Master audit plan: findings A-G, B1-B11 (see change proposals for links).
  Artifacts are written in English.

rules:
  tasks:
    - Each task lists the exact files it owns; tasks that share a file must be ordered, never parallel
    - Each task states its red->green test or verify command
