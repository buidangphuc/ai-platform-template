# Local golden path: the API with the standard opt-in stack (Postgres + Redis)
# enabled via environment. The template's code defaults keep every capability
# off; this file is the worked example of turning the standard stack on.
#
#   make docker-run              # api + worker + postgres + redis
#     (the worker also runs the task outbox relay and lease reclaim; run
#      `make migrate` against the stack's postgres first -- tasks/outbox tables)
#   make docker-run-langfuse     # + the self-hosted Langfuse overlay
#     (ops/compose/langfuse.yaml layers the tracing stack on top)

# Async-task stack shared by the api (submits) and the worker (processes).
# Tasks and their outbox event commit in one Postgres transaction; the worker
# relays the event to the Redis queue.
x-task-env: &task-env
  DATABASE_ENABLED: "true"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-ai_platform}
  REDIS_ENABLED: "true"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  QUEUE_ENABLED: "true"
  QUEUE_BACKEND: redis
  TASKS_ENABLED: "true"
  TASK_STORE_BACKEND: postgres
  TASKS_DISPATCH_BACKEND: outbox
  OUTBOX_ENABLED: "true"
  OUTBOX_BACKEND: postgres

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-platform:local
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      AUTH_API_KEYS: "${AUTH_API_KEYS:-local-user:admin:2a61522f4af871304802321c6a35fcf5d0aa49e2d9dc4aedf9cf1c7fdb78b906}"
      # Standard stack: database + redis + async tasks (see x-task-env).
      <<: *task-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-platform

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-platform:local
    command: ["python", "-m", "scripts.run_worker"]
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      AUTH_API_KEYS: "${AUTH_API_KEYS:-local-user:admin:2a61522f4af871304802321c6a35fcf5d0aa49e2d9dc4aedf9cf1c7fdb78b906}"
      <<: *task-env
    healthcheck:
      disable: true  # the image's HTTP healthcheck targets the api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-platform

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_platform}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ai-platform

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ai-platform

networks:
  ai-platform:

volumes:
  postgres-data:
