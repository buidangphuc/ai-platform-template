name: test

on:
  push:
  pull_request:

# Settings requires POSTGRES_* and REDIS_HOST at import time; .env.example holds
# valid defaults (all optional capabilities disabled), so jobs load it via
# `uv run --env-file`.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (all extras)
        run: uv sync --dev --all-extras
      - name: Ruff format
        run: uv run ruff format --check app tests scripts alembic
      - name: Ruff lint
        run: uv run ruff check app tests scripts alembic
      - name: Pyright
        run: uv run --all-extras pyright
      - name: Pre-commit hooks (commit-msg stage skipped)
        run: uv run pre-commit run --all-files --hook-stage pre-commit
        env:
          SKIP: commitizen

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (all extras)
        run: uv sync --dev --all-extras
      - name: Run tests with coverage
        run: uv run --all-extras pytest -q --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Eval gate (deterministic cases — judge cases skip without JUDGE_CHAT_MODEL)
        run: uv run --env-file .env.example --all-extras python -m scripts.run_eval --min-score 0.8

  runtime-imports:
    # The Docker image installs without dev deps; make sure the app still imports.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install runtime deps only
        run: uv sync --frozen --no-dev
      - name: Import the app and worker entrypoints
        run: >-
          uv run --no-dev --env-file .env.example
          python -c "import main, scripts.run_worker; print('ok')"

  redis-adapters:
    # fakeredis hid real behaviour twice (stream trimming, XDEL); re-run on Redis.
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (all extras)
        run: uv sync --dev --all-extras
      - name: Redis-backed tests on a real Redis
        env:
          REAL_REDIS_URL: redis://localhost:6379/15
        run: >-
          uv run --all-extras pytest -q -p tests.plugins.real_redis
          tests/unit/modules/queues/test_redis_stream.py
          tests/unit/modules/tasks/test_redis_store.py
          tests/unit/modules/cache/test_redis.py
          tests/unit/modules/test_rate_limit.py

  mongo-adapters:
    # Concurrency on the Mongo quota store needs a real server (fakes serialize).
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (all extras)
        run: uv sync --dev --all-extras
      - name: Mongo quota store tests
        env:
          QUOTA_TEST_MONGO_URI: mongodb://localhost:27017
        run: uv run --all-extras pytest -q tests/unit/modules/test_quota_mongo_real.py

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: ai_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # pragma: allowlist secret
      POSTGRES_DB: ai_platform
      REDIS_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (all extras)
        run: uv sync --dev --all-extras
      - name: Apply migrations
        run: uv run --all-extras alembic upgrade head
      - name: Check models match migrations
        run: uv run --all-extras alembic check
      - name: Postgres adapter tests (recreate their own tables; runs last)
        env:
          QUOTA_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_platform # pragma: allowlist secret
          IDEMPOTENCY_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_platform # pragma: allowlist secret
          TASKS_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_platform # pragma: allowlist secret
        run: >-
          uv run --all-extras pytest -q
          tests/unit/modules/test_quota_postgres_store.py
          tests/unit/modules/test_idempotency_postgres_store.py
          tests/unit/modules/tasks/test_postgres_store.py
          tests/integration/test_task_outbox_flow.py

  aws-adapters:
    # The SQS/S3 gateways verify their target at open() and SQS dead-letters
    # explicitly; fakes cannot prove either, so run against ElasticMQ and LocalStack.
    runs-on: ubuntu-latest
    services:
      elasticmq:
        image: softwaremill/elasticmq-native:1.6.9
        ports:
          - 9324:9324
      localstack:
        image: localstack/localstack:3.8
        env:
          SERVICES: s3
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (all extras)
        run: uv sync --dev --all-extras
      - name: Wait for ElasticMQ
        run: >-
          for i in $(seq 1 30); do
          curl -s -o /dev/null http://localhost:9324/ && exit 0; sleep 1; done; exit 1
      - name: SQS and S3 tests on real servers
        env:
          AWS_ACCESS_KEY_ID: test # pragma: allowlist secret
          AWS_SECRET_ACCESS_KEY: test # pragma: allowlist secret
          SQS_TEST_ENDPOINT_URL: http://localhost:9324
          S3_TEST_ENDPOINT_URL: http://localhost:4566
        run: >-
          uv run --all-extras pytest -q
          tests/unit/modules/queues/test_sqs_real.py
          tests/unit/modules/objects/test_s3_real.py
