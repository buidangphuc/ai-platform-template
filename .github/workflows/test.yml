name: test

on:
  push:
    branches: [main]
  pull_request:

# Settings requires POSTGRES_* and REDIS_HOST at import time; .env.example holds
# valid defaults (all optional capabilities disabled), so jobs load it via
# `uv run --env-file`.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (all extras)
        run: uv sync --dev --all-extras
      - name: Lint, types, layers, hooks
        run: make check typecheck arch hooks

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install (all extras)
        run: uv sync --dev --all-extras
      - name: Tests and eval gate
        run: make test-ci eval-ci
